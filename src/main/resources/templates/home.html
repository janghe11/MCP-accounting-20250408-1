<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/default :: layout(${title}, ~{::section})}">
<head>
    <title>홈</title>
</head>
<body>
    <section>
        <div class="jumbotron">
            <h1 class="display-4">회계 학습 시스템</h1>
            <p class="lead" th:text="${message}">회계 학습을 위한 웹 애플리케이션에 오신 것을 환영합니다!</p>
            <hr class="my-4">
            <p>회계의 기본 원칙부터 재무제표 분석까지 단계별로 학습할 수 있습니다.</p>
            <a class="btn btn-primary btn-lg" href="/basics" role="button">회계 기초 배우기</a>
        </div>
        
        <div class="row mt-4">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">회계 기초</h5>
                        <p class="card-text">회계의 기본 원칙과 개념을 배웁니다.</p>
                        <a href="/basics" class="btn btn-primary">자세히 보기</a>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">원장 관리</h5>
                        <p class="card-text">원장 기입과 관리 방법을 배웁니다.</p>
                        <a href="/ledger" class="btn btn-primary">자세히 보기</a>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">재무제표</h5>
                        <p class="card-text">대차대조표, 손익계산서, 현금흐름표를 이해합니다.</p>
                        <a href="/financial-statements" class="btn btn-primary">자세히 보기</a>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
